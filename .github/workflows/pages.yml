name: Publication GitHub Pages
# À chaque envoi sur main : publie l'application sur la branche gh-pages (https://<utilisateur>.github.io/<depot>/).
# Aucun réglage manuel de Pages n'est nécessaire (comme pour MEMP-CP et CS Pobè).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier sur la branche gh-pages
        run: |
          rm -rf /tmp/site && mkdir /tmp/site
          tar --exclude=.git --exclude=.github --exclude=tools --exclude='*.zip' -cf - . | tar -xf - -C /tmp/site
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
